{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ToDoリスト</title>
  <link rel="stylesheet" href="{% static 'testapp/style.css' %}" />
</head>
<body>
  <div class="todo-container">
    <h1>ToDoリスト</h1>
    <form class="todo-form">
      <input type="text" class="todo-input" placeholder="やることを入力..." required />
      <button type="submit" class="add-button">追加</button>
    </form>
    <ul class="todo-list" id="todo-list"></ul>
  </div>

  <script src="{% static 'testapp/script.js' %}"></script>
</body>
</html>
